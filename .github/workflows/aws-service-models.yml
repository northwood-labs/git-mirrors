---
name: "AWS Service Models"
on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"

defaults:
  run:
    shell: bash

env:
  DOCKER_BUILDKIT: 1

permissions: read-all

jobs:
  lookup:
    runs-on: ubuntu-latest
    name: Perform mirroring
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            hosted-compute-watchdog-prod-eus-02.githubapp.com:443
            hosted-compute-watchdog-prod-iad-01.githubapp.com:443
            hosted-compute-watchdog-prod-iad-02.githubapp.com:443

      - name: Configure Git to use HTTPS with the PAT
        run: |
          git config --global url."https://${{ secrets.GH_PUBLIC_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${{ secrets.GH_PUBLIC_TOKEN }}@github.com".insteadOf "ssh://git@github.com"
          git config --global advice.detachedHead false
          git config --global user.name "NWL Bot"
          git config --global user.email "bot@northwood-labs.com"

      - name: Sync github.com/aws/api-models-aws → github.com/northwood-labs/aws-service-models
        run: |
          git clone --bare "https://github.com/aws/api-models-aws" ".api-models-aws"
          cd ".api-models-aws" && git push --force --mirror "https://github.com/northwood-labs/aws-service-models.git"
          git clone "https://github.com/northwood-labs/aws-service-models.git" "${{ github.workspace }}/aws-service-models"

      - name: Disable upstream workflows
        working-directory: ./.api-models-aws
        run: |
          if [ -d /path/to/directory ]; then
            find .github/workflows/ -type f -name "*.yml" | xargs -I% mv -vf "%" "%.bak"
            git add .
            git commit -a -m "automated: Disabled upstream workflows."
            git push origin "$(git rev-parse --abbrev-ref HEAD)"
          fi

      - name: Tag
        working-directory: "${{ github.workspace }}/aws-service-models"
        run: |
          COMMIT_DATE="$(git log -1 --format="%at")"
          YY=$(date -d @$COMMIT_DATE +%Y)
          MM=$(( 10#$(date -d @$COMMIT_DATE +%m) ))
          DD=$(( 10#$(date -d @$COMMIT_DATE +%d) ))

          git tag "${YY}.${MM}.${DD}" && \
          git push --tags "https://github.com/northwood-labs/aws-service-models.git"
