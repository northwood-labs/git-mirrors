      # @config-manager:end step-security-hosts

      # @config-manager:start workflow-clone
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # @config-manager:end workflow-clone

      # @config-manager:start github-app-token
      - name: Fetch temporary app token for job
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gh_token
        with:
          client-id: ${{ vars.MIRRORING_CLIENT_ID }}
          private-key: ${{ secrets.MIRRORING_PRIVATE_KEY }}
          owner: northwood-labs
          repositories: git-mirrors
          permission-contents: write
      # @config-manager:end github-app-token

      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.gh_token.outputs.token }}
        run: |
          echo "user-id=$(gh api "/users/${{ steps.gh_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Set Git config
        env:
          GH_TOKEN: ${{ steps.gh_token.outputs.token }}
        run: |
          git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${GH_TOKEN}@github.com".insteadOf "ssh://git@github.com"
          git config --global advice.detachedHead false
          git config --global user.name '${{ steps.gh_token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.gh_token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git

      # @config-manager:start setup-go
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">= 1.27.0"
          check-latest: true
          token: ${{ github.token }}
          cache: false
          cache-dependency-path: "go.sum"
      # @config-manager:end setup-go

      - name: Sync https://github.com/reviewdog/reviewdog → github.com/northwood-labs/reviewdog
        env:
          GH_TOKEN: ${{ steps.gh_token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GH_PUBLIC_TOKEN }}
        run: |
          echo "REVIEWDOG_VERSION=$(gh api /repos/reviewdog/reviewdog/releases/latest | jq -Mr '.name[1:]')" >> $GITHUB_ENV

          git clone --bare "https://github.com/reviewdog/reviewdog.git" "${{ github.workspace }}/.reviewdog"
          cd ".reviewdog" && git push --force --mirror "https://github.com/northwood-labs/reviewdog.git"
          git clone "https://github.com/northwood-labs/reviewdog.git" "${{ github.workspace }}/reviewdog"

      - name: Disable upstream workflows
        working-directory: "${{ github.workspace }}/reviewdog"
        run: |
          find .github/workflows/ -type f -name "*.yml" | xargs -I% mv -vf "%" "%.bak"
          git add .
          git commit -a -m "automated: Disabled upstream workflows." || true
          git push origin "$(git rev-parse --abbrev-ref HEAD)"

      - name: Clone Reviewdog
        run: |
          git clone --single-branch --branch "v${REVIEWDOG_VERSION}" \
            "https://github.com/northwood-labs/reviewdog.git" \
            "${{ github.workspace }}/reviewdog-patched"

      - name: Patch Reviewdog
        working-directory: "${{ github.workspace }}/reviewdog-patched"
        run: |
          sed -i -r "s|reported by \[reviewdog\]\(https://github.com/reviewdog/reviewdog\) :dog:||g" ./doghouse/server/doghouse.go

          ARCH="$(download-asset os-arch -p '{{.Arch}}')"
          echo "::notice::Architecture: ${ARCH}"

          echo "::group::Lookup existing releases"
          LIST_RELEASES="$(gh api /repos/northwood-labs/reviewdog/releases)"

          echo "$LIST_RELEASES" | jq '.'
          echo "::endgroup::"

          RELEASE_ID="$(echo "$LIST_RELEASES" | jq '.[] | select(.name == "'"v${REVIEWDOG_VERSION}"'") | .id')"
          if [ -z $RELEASE_ID ]; then
            echo "::notice::ReleaseID: <empty>"
          else
            echo "::notice::ReleaseID: ${RELEASE_ID}"
          fi

          if [ -z $RELEASE_ID ]; then
            echo "::notice::Creating a new release for the latest tag"
            gh release create v${REVIEWDOG_VERSION} \
              --repo northwood-labs/reviewdog \
              --title "v${REVIEWDOG_VERSION}" \
              --notes "" \
              --latest \
              ;

            RELEASE_ID="$(gh release view v${REVIEWDOG_VERSION} --repo northwood-labs/reviewdog --json databaseId --jq '.databaseId')"
            echo "::notice::ReleaseID: ${RELEASE_ID}"
          else
            echo "::debug::Release exists"
          fi

          AMD64_RELEASE="$(echo "$LIST_RELEASES" | jq '.[] | select(.name == "'"v${REVIEWDOG_VERSION}"'") | .assets[] | select(.name == "reviewdog_amd64")')"
          ARM64_RELEASE="$(echo "$LIST_RELEASES" | jq '.[] | select(.name == "'"v${REVIEWDOG_VERSION}"'") | .assets[] | select(.name == "reviewdog_arm64")')"

          echo "::group::If empty, there is no asset. Build and upload amd64"
          if [ -z "$AMD64_RELEASE" ]; then
            echo "::notice::Building for amd64"

            # Build
            GOARCH=amd64 GOOS=linux go build -ldflags="-s -w -X github.com/reviewdog/reviewdog/commands.Version=${REVIEWDOG_VERSION}" -o "${{ github.workspace }}/reviewdog_amd64" ./cmd/reviewdog/
            "${{ github.workspace }}/reviewdog_${ARCH}" -version || true

            # Upload
            gh release upload "v${REVIEWDOG_VERSION}" "${{ github.workspace }}/reviewdog_amd64" --repo northwood-labs/reviewdog
          else
            echo "Asset exists."
          fi
          echo "::endgroup::"

          echo "::group::If empty, there is no asset. Build and upload arm64"
          if [ -z "$ARM64_RELEASE" ]; then
            echo "::notice::Building for arm64"

            # Build
            GOARCH=arm64 GOOS=linux go build -ldflags="-s -w -X github.com/reviewdog/reviewdog/commands.Version=${REVIEWDOG_VERSION}" -o "${{ github.workspace }}/reviewdog_arm64" ./cmd/reviewdog/
            "${{ github.workspace }}/reviewdog_${ARCH}" -version || true

            # Upload
            gh release upload "v${REVIEWDOG_VERSION}" "${{ github.workspace }}/reviewdog_arm64" --repo northwood-labs/reviewdog
          else
            echo "Asset exists."
          fi
          echo "::endgroup::"
