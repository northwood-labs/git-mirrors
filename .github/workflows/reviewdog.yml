---
name: "Reviewdog"
on:
  workflow_dispatch:
  schedule:
    - cron: "33 12 * * *"

defaults:
  run:
    shell: bash

env:
  DOCKER_BUILDKIT: 1

permissions: read-all

jobs:
  lookup:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Perform mirroring
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false

    steps:
      # @config-manager:start harden-runner
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        # @config-manager:end harden-runner
        # @config-manager:start step-security-hosts
